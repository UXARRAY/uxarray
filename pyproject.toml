[project]
classifiers=[
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dynamic = ["version"]
keywords = ["unstructured grids", "xarray", "ugrid", "mpas", "exodus", "scrip", "fesom", "icon", "esmf"]
description = "Xarray extension for unstructured climate and global weather data analysis and visualization."
license = {file = "LICENSE"}
name = "uxarray"
readme = "README.md"
requires-python = ">=3.11"

# minimal dependencies start
dependencies = [
  "antimeridian",
  "dask[dataframe]",
  "netcdf4",
  "numba>=0.63",  # 0.63 is the first release supporting Python 3.14 (3.10 <= py < 3.15). See #1561.
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "shapely",
  "xarray",
  "polars",
]
# minimal dependencies end

[project.optional-dependencies]
all = ["uxarray[dev,geo,viz]"]
complete = ["uxarray[dev,geo,viz]"]  # alias to "all"
dev = [
    'asv',
    'pooch',
    'pre_commit',
    'pytest',
    'pytest-cov',
    'ruff',
]
geo = [
    "cartopy",  # also in [viz]; needed here by to_geodataframe(). No lower bound: the 0.26 floor exists only for matplotlib 3.11, which is a [viz] dependency.
    "geopandas>=1.0",  # 1.0 is the first release requiring pyogrio, the file-IO backend read_file needs. See #1693.
    "healpix",
    "pyproj",
    "spatialpandas",
]
viz = [
    "cartopy>=0.26",  # 0.26 is the first release that works with matplotlib 3.11; see issue #1542.
    "datashader",
    "matplotlib",
    "geoviews",
    "holoviews",
    "hvplot",
]

[project.urls]
Documentation = "https://uxarray.readthedocs.io/"
Source = "https://github.com/UXARRAY/uxarray"
Tracker = "https://github.com/UXARRAY/uxarray/issues"
# please keep [project.urls] immediately after [project.optional-dependencies],
# or, if rearranging sections, make sure to edit installation.rst accordingly.

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=60",
  "setuptools-scm>=8",
]

[tool.setuptools]
packages = ["uxarray"]

[tool.setuptools_scm]
fallback_version = "9999"

[tool.ruff]
extend-exclude = ["test","benchmarks"]

[tool.ruff.lint]
extend-select = ["I"]
extend-ignore = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["uxarray"]

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["E402", "F401"]
"uxarray/plot/*" = ["E402", "F401"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["test"]  # (intentionally excludes test_optional_deps)
