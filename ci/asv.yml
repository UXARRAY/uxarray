name: asv
channels:
  - conda-forge
dependencies:
  - python=3.11
  - cartopy>=0.26   # 0.26 is the first release that works with matplotlib 3.11; see issue #1542.
  - dask
  - datashader
  - geoviews
  - holoviews
  - matplotlib-base
  - matplotlib-inline
  - healpix
  - netcdf4
  - numba
  - numpy
  - pandas
  - pathlib
  - pre_commit
  - polars
  - pyarrow
  - pytest
  - pytest-cov
  - requests
  - scikit-learn
  - scipy
  - shapely
  - spatialpandas
  - geopandas
  - xarray
  - asv
  - hvplot
  - pip:
    - antimeridian
    - -e ../
