name: asv
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cartopy>=0.26.0  # older releases break some plots with matplotlib>=3.11; see issue #1542.
  - dask
  - datashader
  - geoviews>=1.16.0  # older releases break some plots with cartopy>=0.26.0; see issue #1780.
  - holoviews
  - matplotlib-base
  - matplotlib-inline
  - healpix
  - netcdf4
  - numba
  - numpy
  - pandas
  - pathlib
  - pre_commit
  - polars
  - pyarrow
  - pytest
  - pytest-cov
  - requests
  - scikit-learn
  - scipy
  - shapely
  - spatialpandas
  - geopandas
  - xarray
  - asv
  - hvplot
  - pip:
    - antimeridian
    - -e ../
