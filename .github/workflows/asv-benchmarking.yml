name: ASV Benchmarking

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # Without this the platform's 6h cap is the only limit, which is how a
    # mis-skipped range quietly turns into a 453-commit build.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_ENV_FILE: ./ci/asv.yml
      ASV_DIR: ./benchmarks

    steps:
      - name: Checkout uxarray
        uses: actions/checkout@v7
        with:
          repository: UXARRAY/uxarray
          ref: main
          fetch-depth: 0

      - name: Fetch all tags and branches for uxarray
        run: |
          git fetch --all --tags

      - name: Checkout uxarray-asv
        uses: actions/checkout@v7
        with:
          repository: UXARRAY/uxarray-asv
          persist-credentials: false
          fetch-depth: 0
          ref: main
          path: uxarray-asv

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: "24.1.2-0"
          activate-environment: asv

      - name: Get date
        id: get-date
        run: echo "today=$(/bin/date -u '+%Y%m%d')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache environment
        uses: actions/cache@v6
        with:
          path: ${{ env.CONDA }}/envs
          key: conda-${{ runner.os }}--${{ runner.arch }}--${{ steps.get-date.outputs.today }}-${{ hashFiles('./ci/asv.yml') }}-${{ env.CACHE_NUMBER }}
        env:
          CACHE_NUMBER: 0
        id: cache

      - name: Update environment
        run:
          conda env update -n asv -f ./ci/asv.yml
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Conda list
        run: |
          conda info
          conda list

      - name: Copy existing results
        run: |
          if [ -d "uxarray-asv/results" ]; then
            cp -r uxarray-asv/results benchmarks/
          fi

      # asv builds its own conda environment under ``benchmarks/env`` from
      # ci/environment.yml (see asv.conf.json). No restore-keys: asv reuses a
      # restored env without checking it, so a prefix match would hand it one
      # built from an older environment file.
      - name: Cache asv's benchmark environment
        uses: actions/cache@v6
        with:
          path: ${{ env.ASV_DIR }}/env
          key: "asv-env-${{runner.os}}-${{runner.arch}}-${{hashFiles('ci/environment.yml', 'benchmarks/asv.conf.json')}}"

      - name: Cache the benchmark fixtures
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ASV_DIR }}/oQU*.nc
            ${{ env.ASV_DIR }}/_io_cache
          key: asv-fixtures-${{ runner.os }}-${{ hashFiles('benchmarks/helpers/_fixtures.py') }}
          restore-keys: |
            asv-fixtures-${{ runner.os }}-

      - name: Run benchmarks
        shell: bash -l {0}
        id: benchmark
        run: |
          # Fill the fixture cache before asv preimports the suite, which would otherwise build it serially in the forkserver parent
          python -m benchmarks.helpers._fixtures
          cd benchmarks
          asv machine --machine GH-Actions --os ubuntu-latest --arch x64 --cpu "2-core unknown" --ram 7GB
          # ``--skip-existing-commits``, not ``--skip-existing``: the latter keys
          # its skip set by (commit, env), so asv's per-commit check never
          # matches and it builds and installs every commit in the range before
          # skipping the benchmarks it already has.
          asv run main^! --skip-existing-commits --parallel || true

      - name: Commit and push benchmark results
        run: |
          if [ -d "uxarray-asv/results" ]; then
            rm -r uxarray-asv/results
          fi
          cp -r benchmarks/results/ uxarray-asv/
          cd uxarray-asv
          git config --local user.email "${{ secrets.UXARRAY_ASV_EMAIL }}"
          git config --local user.name "${{ secrets.UXARRAY_ASV_USER_NAME }}"
          git add results
          git commit -m "[🤖] Update benchmark results"

      - name: Push to uxarray-asv
        if: github.ref == 'refs/heads/main' && github.repository == 'UXARRAY/uxarray'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.UXARRAY_ASV_PAT }}
          branch: main
          force: true
          repository: UXARRAY/uxarray-asv
          directory: uxarray-asv
