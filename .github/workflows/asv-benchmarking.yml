name: ASV Benchmarking

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # Otherwise only the 6h platform cap stops a runaway range build.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_ENV_FILE: ./ci/asv.yml
      ASV_DIR: ./benchmarks

    steps:
      - name: Checkout uxarray
        uses: actions/checkout@v7
        with:
          repository: UXARRAY/uxarray
          ref: main
          fetch-depth: 0

      - name: Fetch all tags and branches for uxarray
        run: |
          git fetch --all --tags

      - name: Checkout uxarray-asv
        uses: actions/checkout@v7
        with:
          repository: UXARRAY/uxarray-asv
          persist-credentials: false
          fetch-depth: 0
          ref: main
          path: uxarray-asv

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: "24.1.2-0"
          activate-environment: asv

      - name: Get date
        id: get-date
        run: echo "today=$(/bin/date -u '+%Y%m%d')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache environment
        uses: actions/cache@v6
        with:
          path: ${{ env.CONDA }}/envs
          key: conda-${{ runner.os }}--${{ runner.arch }}--${{ steps.get-date.outputs.today }}-${{ hashFiles('./ci/asv.yml') }}-${{ env.CACHE_NUMBER }}
        env:
          CACHE_NUMBER: 0
        id: cache

      - name: Update environment
        run:
          conda env update -n asv -f ./ci/asv.yml
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Conda list
        run: |
          conda info
          conda list

      - name: Copy existing results
        run: |
          if [ -d "uxarray-asv/results" ]; then
            cp -r uxarray-asv/results benchmarks/
          fi

      # asv builds benchmarks/env from ci/environment.yml (per asv.conf.json), not
      # ci/asv.yml. No restore-keys: asv reuses a restored env without checking it.
      - name: Cache asv's benchmark environment
        uses: actions/cache@v6
        with:
          path: ${{ env.ASV_DIR }}/env
          key: "asv-env-${{runner.os}}-${{runner.arch}}-${{hashFiles('ci/environment.yml', 'benchmarks/asv.conf.json')}}"

      - name: Cache the benchmark fixtures
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ASV_DIR }}/oQU*.nc
            ${{ env.ASV_DIR }}/_io_cache
          key: asv-fixtures-${{ runner.os }}-${{ hashFiles('benchmarks/helpers/_fixtures.py') }}
          restore-keys: |
            asv-fixtures-${{ runner.os }}-

      - name: Run benchmarks
        shell: bash -l {0}
        id: benchmark
        run: |
          # Fill the fixture cache before asv preimports the suite, which would otherwise build it serially in the forkserver parent
          python -m benchmarks.helpers._fixtures
          cd benchmarks
          asv machine --machine GH-Actions --os ubuntu-latest --arch x64 --cpu "2-core unknown" --ram 7GB
          # --skip-existing-commits, not --skip-existing: the latter still builds
          # every commit in the range before skipping benchmarks it already has.
          asv run main^! --skip-existing-commits --parallel || true

      - name: Commit and push benchmark results
        run: |
          if [ -d "uxarray-asv/results" ]; then
            rm -r uxarray-asv/results
          fi
          cp -r benchmarks/results/ uxarray-asv/
          cd uxarray-asv
          git config --local user.email "${{ secrets.UXARRAY_ASV_EMAIL }}"
          git config --local user.name "${{ secrets.UXARRAY_ASV_USER_NAME }}"
          git add results
          git commit -m "[🤖] Update benchmark results"

      - name: Push to uxarray-asv
        if: github.ref == 'refs/heads/main' && github.repository == 'UXARRAY/uxarray'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.UXARRAY_ASV_PAT }}
          branch: main
          force: true
          repository: UXARRAY/uxarray-asv
          directory: uxarray-asv

      # The PR workflow plans its shards from asv's recorded durations, and a
      # PR's own caches are invisible to other PRs, so without this every PR's
      # first run splits by count. Only this commit's results: _partition
      # averages every file it finds, and the history has since-redefined
      # benchmarks. After the push, so the pruning never reaches uxarray-asv.
      - name: Keep only this commit's durations
        id: durations
        working-directory: ${{ env.ASV_DIR }}
        run: |
          sha=$(git rev-parse HEAD)
          find results -name '*.json' ! -name benchmarks.json ! -name machine.json \
            ! -name "${sha:0:8}-*" -delete
          # A failed run leaves nothing; don't shadow an older cache with that.
          if compgen -G "results/*/${sha:0:8}-*.json" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # Same path and key prefix the PR workflow restores.
      - name: Save recorded durations for PR runs
        if: steps.durations.outputs.found == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ASV_DIR }}/results
          key: asv-results-${{ runner.os }}-${{ github.run_id }}
