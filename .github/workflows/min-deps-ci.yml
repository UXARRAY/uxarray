name: CI Minimum Dependencies
# Tests the oldest Python allowed by requires-python together with the oldest
# release of each dependency still supported under SPEC 0, raised to any lower
# bound in pyproject.toml.  ci/min-deps.py works those versions out from PyPI
# release dates on each run, so nothing here needs to be bumped by hand.
#
# A failure means an older release that pyproject.toml still allows is broken:
# add a lower bound for it, with a comment saying what breaks.
on:
  workflow_dispatch:
  schedule:
     - cron: '0 0 * * 1' # Weekly, Mondays at 00:00
  pull_request:
    paths:
      - pyproject.toml
      - ci/min-deps.py
      - .github/workflows/min-deps-ci.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  min-deps:
    name: min-deps
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      MPLBACKEND: Agg
    outputs:
      testresults: ${{ steps.tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0  # setup-uv doesn't publish major-version tags

      - name: Find oldest supported versions
        run: |
          python_version=$(uv run --no-project --with packaging python ci/min-deps.py --python-version)
          echo "PYTHON_VERSION=${python_version}" >> "$GITHUB_ENV"
          uv run --no-project --with packaging python ci/min-deps.py > requirements-min.txt
          cat requirements-min.txt
          {
            echo '```'
            cat requirements-min.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create environment
        run: |
          uv venv --python "${PYTHON_VERSION}" .venv
          echo "VIRTUAL_ENV=${PWD}/.venv" >> "$GITHUB_ENV"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"

      - name: Install oldest dependencies
        run: |
          # lowest-direct installs the oldest allowed release of each package
          # listed, but the newest of anything they pull in.
          uv pip install --no-build --resolution lowest-direct -r requirements-min.txt
          # Test-only packages get their newest releases, without moving
          # anything installed above.
          uv pip freeze > constraints-min.txt
          uv pip install --no-build -c constraints-min.txt \
            h5netcdf \
            hypothesis \
            matplotlib-inline \
            pooch \
            pyarrow \
            pytest \
            requests

      - name: Install uxarray
        run: |
          uv pip install --no-deps .

      - name: List packages
        run: |
          uv pip list

      - name: Running Tests
        id: tests
        run: |
          python -m pytest test -v

  failure-issue:
    name: failure-issue
    needs: [min-deps]
    if: |
      needs.min-deps.outputs.testresults != 'success'
      && github.event_name != 'pull_request'
      && github.repository == 'UXARRAY/uxarray'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Create or update failure issue
        shell: bash
        run: |
          # Read the template
          template=$(cat .github/min-deps-failure-issue-template.md)

          # Replace placeholders
          issue_body="${template//\{\{WORKFLOW\}\}/${{ github.workflow }}}"
          issue_body="${issue_body//\{\{RUN_ID\}\}/${{ github.run_id }}}"
          issue_body="${issue_body//\{\{RUN_URL\}\}/${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}}"
          issue_body="${issue_body//\{\{DATE\}\}/$(date -u)}"

          # Prefix used for identity/matching; date suffix is for display only
          title_prefix="🤖 Minimum dependency testing failure"
          issue_title="${title_prefix} ($(date -u +%Y-%m-%d))"

          # Find existing open issue whose title starts with the fixed prefix
          existing_issue=$(gh issue list --state open --label "CI" --json number,title \
            --jq '.[] | select(.title | startswith("'"$title_prefix"'")) | .number' \
            | head -n1)

          if [ -n "$existing_issue" ]; then
            echo "Found existing open issue #$existing_issue, updating it..."
            echo "$issue_body" | gh issue edit "$existing_issue" \
              --title "$issue_title" \
              --body-file -
            echo "Updated existing issue #$existing_issue"
          else
            echo "No existing open issue found, creating new one..."
            echo "$issue_body" | gh issue create \
              --title "$issue_title" \
              --body-file - \
              --label "CI"
            echo "Created new issue"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  report-failed:
    name: report-failed
    needs: [min-deps, failure-issue]
    if: ${{ always() && needs.min-deps.outputs.testresults != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: make sure to report a failed workflow
        run: |
          exit 1
