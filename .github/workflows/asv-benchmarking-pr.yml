name: ASV Benchmarking (PR)

# This workflow runs untrusted fork code, so it only gets a read-only token and
# no write access. It must NOT post comments itself (forks get a read-only token
# -> 403). Instead it uploads the results + PR number as an artifact, and the
# separate asv-benchmarking-comment.yml (triggered via workflow_run) posts the
# comment with the repo's write token. See issue #1547.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      base_ref:
        description: >-
          Branch, tag or commit to compare against, via its merge-base with the
          dispatched ref (so name the branch a topic branch will merge into).
        required: false
        default: main
      shards:
        description: >-
          Runners to split the suite over. Each pays a fixed ~1 min (env
          restore, install, numba warmup), so past about four gains little.
        required: false
        default: "4"

env:
  PR_HEAD_LABEL: ${{ github.event.pull_request.head.label }}
  ASV_DIR: "./benchmarks"
  CONDA_ENV_FILE: ci/environment.yml
  # Shared by every shard so their results merge under one machine.
  ASV_MACHINE: gh-linux-x64

jobs:
  setup:
    name: Setup
    if: ${{ contains(github.event.pull_request.labels.*.name, 'run-benchmark') && github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.base.outputs.sha }}
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record CPU topology
        # A diagnostic; never fail the job over it.
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\):|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)|CPU max MHz' || lscpu || true

      - name: Set up Conda environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ${{env.CONDA_ENV_FILE}}
          cache-environment: true
          environment-name: uxarray_build
          cache-environment-key: "${{runner.os}}-${{runner.arch}}-${{hashFiles(env.CONDA_ENV_FILE)}}-benchmark"
          create-args: >-
            asv
            python-build
            mamba

      - name: Resolve the baseline commit
        id: base
        # pull_request.* expressions are empty on workflow_dispatch.
        run: |
          set -ex
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            BASE_REF="${{ github.event.inputs.base_ref }}"
            BASE_REF="${BASE_REF:-main}"
            git rev-parse --verify -q "origin/$BASE_REF" >/dev/null \
              || git fetch -q origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            BASE=$(git merge-base "$GITHUB_SHA" "origin/$BASE_REF")
          fi
          if [ "$BASE" = "$(git rev-parse "$GITHUB_SHA")" ]; then
            # Dispatched from main itself: compare it against the commit before.
            BASE=$(git rev-parse "$GITHUB_SHA^")
          fi
          # Fail rather than let asv infer a baseline of its own.
          test -n "$BASE" || { echo "could not determine a baseline commit" >&2; exit 1; }
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      # asv rebuilds its own env under benchmarks/env/ each run; caching skips the
      # solve. No restore-keys: asv reuses a restored env without checking it.
      - name: Cache asv's benchmark environment
        uses: actions/cache@v6
        with:
          path: ${{ env.ASV_DIR }}/env
          key: "asv-env-${{runner.os}}-${{runner.arch}}-${{hashFiles(env.CONDA_ENV_FILE, 'benchmarks/asv.conf.json')}}"

      - name: Cache the benchmark fixtures
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ASV_DIR }}/oQU*.nc
            ${{ env.ASV_DIR }}/_io_cache
          key: asv-fixtures-${{ runner.os }}-${{ hashFiles('benchmarks/helpers/_fixtures.py') }}
          restore-keys: |
            asv-fixtures-${{ runner.os }}-

      # The env cache key has no commit in it, so on a hit nothing is saved and the
      # wheels built below would be lost; cache them (a few MB) per commit pair.
      - name: Cache the built wheels
        uses: actions/cache@v6
        with:
          path: ${{ env.ASV_DIR }}/env/*/asv-build-cache
          key: asv-wheels-${{ runner.os }}-${{ steps.base.outputs.sha }}-${{ github.sha }}

      # _partition balances shards by asv's recorded durations; with none it
      # splits by count. Restore-only: the merge job saves the updated tree.
      - name: Restore recorded durations
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ASV_DIR }}/results
          key: asv-results-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            asv-results-${{ runner.os }}-

      - name: Pre-build and discover
        shell: bash -l {0}
        working-directory: ${{ env.ASV_DIR }}
        env:
          BASE: ${{ steps.base.outputs.sha }}
        # --bench just-discover builds the env and the commit's wheel and writes
        # results/benchmarks.json without running anything. Done once here so a
        # cold cache costs one conda solve, not one per shard.
        run: |
          set -ex
          # Fill the fixture cache before asv preimports the suite, which would otherwise build it serially in the forkserver parent
          (cd .. && python -m benchmarks.helpers._fixtures)
          asv machine --yes
          (cd .. && python -m benchmarks.helpers._machine --name "$ASV_MACHINE")
          asv run --bench just-discover "${BASE}^!"
          asv run --bench just-discover "${GITHUB_SHA}^!"

      - name: Plan the shards
        id: plan
        shell: bash -l {0}
        working-directory: ${{ env.ASV_DIR }}
        env:
          SHARDS: ${{ github.event.inputs.shards || '4' }}
        run: |
          set -ex
          # Logs the split so a lopsided one is visible without opening each shard.
          PYTHONPATH=.. python -m benchmarks.helpers._partition --shards "$SHARDS"
          echo "count=$SHARDS" >> "$GITHUB_OUTPUT"
          python -c "import json, os; print('shards=' + json.dumps(list(range(int(os.environ['SHARDS'])))))" \
            >> "$GITHUB_OUTPUT"

      # The whole tree, not just benchmarks.json, so shards weigh the same durations.
      - name: Upload the discovered suite
        uses: actions/upload-artifact@v7
        with:
          name: asv-plan
          path: ${{ env.ASV_DIR }}/results

  benchmark:
    name: Shard ${{ matrix.shard }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      # A failed shard still leaves the rest worth merging.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Conda environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ${{env.CONDA_ENV_FILE}}
          cache-environment: true
          environment-name: uxarray_build
          cache-environment-key: "${{runner.os}}-${{runner.arch}}-${{hashFiles(env.CONDA_ENV_FILE)}}-benchmark"
          create-args: >-
            asv
            python-build
            mamba

      # No restore-keys: asv reuses a restored env without checking it.
      - name: Cache asv's benchmark environment
        uses: actions/cache@v6
        with:
          path: ${{ env.ASV_DIR }}/env
          key: "asv-env-${{runner.os}}-${{runner.arch}}-${{hashFiles(env.CONDA_ENV_FILE, 'benchmarks/asv.conf.json')}}"

      - name: Cache the benchmark fixtures
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ASV_DIR }}/oQU*.nc
            ${{ env.ASV_DIR }}/_io_cache
          key: asv-fixtures-${{ runner.os }}-${{ hashFiles('benchmarks/helpers/_fixtures.py') }}
          restore-keys: |
            asv-fixtures-${{ runner.os }}-

      # Setup's wheels; see the note there.
      - name: Cache the built wheels
        uses: actions/cache@v6
        with:
          path: ${{ env.ASV_DIR }}/env/*/asv-build-cache
          key: asv-wheels-${{ runner.os }}-${{ needs.setup.outputs.base }}-${{ github.sha }}

      - name: Download the discovered suite
        uses: actions/download-artifact@v8
        with:
          name: asv-plan
          path: plan

      - name: Run shard
        shell: bash -l {0}
        working-directory: ${{ env.ASV_DIR }}
        env:
          BASE: ${{ needs.setup.outputs.base }}
          SHARDS: ${{ needs.setup.outputs.count }}
          SHARD: ${{ matrix.shard }}
        # Partition from setup's plan, not this runner's cache, so all shards split the
        # same suite. Nothing checks they tile it; a mismatch silently skips benchmarks.
        run: |
          set -ex
          (cd .. && python -m benchmarks.helpers._fixtures)
          asv machine --yes
          (cd .. && python -m benchmarks.helpers._machine --name "$ASV_MACHINE")
          ASV_ARGS=$(PYTHONPATH=.. python -m benchmarks.helpers._partition \
            --shards "$SHARDS" --shard "$SHARD" --results ../plan \
            --config asv.conf.json --asv-args)
          echo "Baseline:  $BASE"
          echo "Contender: ${GITHUB_SHA} (${PR_HEAD_LABEL:-$GITHUB_REF_NAME})"
          # asv run, not continuous: continuous exits 1 on a regression, same as a
          # broken run. The merge job does the comparison.
          printf '%s\n' "${GITHUB_SHA}" "$BASE" > "$RUNNER_TEMP/commits.txt"
          # Exit 2 means a benchmark failed, not the run; keep the shard's other
          # results and warn rather than fail.
          status=0
          asv run --show-stderr -m "$ASV_MACHINE" $ASV_ARGS \
            "HASHFILE:$RUNNER_TEMP/commits.txt" || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning title=Benchmark failures in shard ${SHARD}::asv exited 2; see the failed entries above"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asv-shard-${{ matrix.shard }}
          path: ${{ env.ASV_DIR }}/results.shard${{ matrix.shard }}
          if-no-files-found: warn

  merge:
    name: Merge and compare
    needs: [setup, benchmark]
    # Run even if a shard failed: the surviving shards' results are still worth merging.
    if: ${{ always() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Conda environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ${{env.CONDA_ENV_FILE}}
          cache-environment: true
          environment-name: uxarray_build
          cache-environment-key: "${{runner.os}}-${{runner.arch}}-${{hashFiles(env.CONDA_ENV_FILE)}}-benchmark"
          create-args: >-
            asv
            python-build
            mamba

      # No merge-multiple: the shards' results files share names.
      - name: Download the shards
        uses: actions/download-artifact@v8
        with:
          pattern: asv-shard-*
          path: shards

      - name: Merge and compare
        shell: bash -l {0}
        working-directory: ${{ env.ASV_DIR }}
        env:
          BASE: ${{ needs.setup.outputs.base }}
        run: |
          set -ex
          asv machine --yes
          (cd .. && python -m benchmarks.helpers._machine --name "$ASV_MACHINE")
          (cd .. && python -m benchmarks.helpers._merge --out benchmarks/results shards/asv-shard-*)
          asv compare --split --machine "$ASV_MACHINE" "$BASE" "${GITHUB_SHA}" \
            > asv_compare_results.txt
          cat asv_compare_results.txt

      # Prints asv's recorded durations. A benchmark's is its final round only;
      # <build> and <setup_cache> are the slowest shard's, since every shard paid them.
      - name: Report where the time went
        if: always()
        shell: bash -l {0}
        run: |
          python - <<'PY' || true
          import glob, json, os

          for path in sorted(glob.glob("benchmarks/results/*/*.json")):
              if os.path.basename(path) in ("machine.json", "benchmarks.json"):
                  continue
              data = json.load(open(path))
              columns = data.get("result_columns") or []
              if "duration" not in columns:
                  continue
              index = columns.index("duration")
              rows = sorted(
                  (float(row[index]), name)
                  for name, row in data["results"].items()
                  if len(row) > index and row[index] is not None
              )
              total = sum(duration for duration, _ in rows) or 1.0
              params = data.get("params", {})
              print(f"\n=== {data['commit_hash'][:8]} on {params.get('cpu', '?')} "
                    f"({params.get('num_cpu', '?')} cpu) ===")
              for key, value in sorted(data.get("durations", {}).items()):
                  print(f"  {value:8.1f}s  {key}")
              print(f"  {total:8.1f}s  all {len(rows)} benchmarks ({total / 60:.1f} min)")
              for duration, name in reversed(rows[-15:]):
                  print(f"  {duration:8.1f}s  {100 * duration / total:5.1f}%  {name}")
          PY

      # Keyed per run so setup's prefix restore picks up the newest.
      - name: Save recorded durations for the next run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ASV_DIR }}/results
          key: asv-results-${{ runner.os }}-${{ github.run_id }}

      - name: Save PR number
        if: always()
        run: echo "${{ github.event.pull_request.number }}" > ${{ env.ASV_DIR }}/pr_number.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: asv-benchmark-results-Linux
          path: |
            ${{ env.ASV_DIR }}/results
            ${{ env.ASV_DIR }}/asv_compare_results.txt
            ${{ env.ASV_DIR }}/pr_number.txt
