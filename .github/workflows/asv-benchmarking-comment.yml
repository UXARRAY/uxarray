name: ASV Benchmarking (Comment)

# Runs AFTER "ASV Benchmarking (PR)" completes. Because it is triggered by
# workflow_run, it executes from the default branch with the repository's own
# GITHUB_TOKEN (read-write), so it CAN post a comment even when the benchmark
# run came from a fork PR (where the token is read-only). It only downloads a
# results artifact and posts text -- it never checks out or executes PR/fork
# code, which keeps the write token safe. Fixes #1547.

on:
  workflow_run:
    workflows: ["ASV Benchmarking (PR)"]
    types:
      - completed

permissions:
  issues: write
  pull-requests: write

jobs:
  comment:
    name: Post benchmark comment
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download benchmark results artifact
        uses: actions/download-artifact@v8
        with:
          name: asv-benchmark-results-Linux
          path: asv-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update result comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // PR number and results were saved by the benchmark workflow.
            const issue_number = parseInt(
              fs.readFileSync('asv-results/pr_number.txt', 'utf8').trim(), 10);
            const compareResults = fs.readFileSync(
              'asv-results/asv_compare_results.txt', 'utf8');
            const { owner, repo } = context.repo;

            // ASV --split emits one heading and table per nonempty category.
            // Keep unfamiliar output visible rather than silently dropping it.
            const headings = {
              'Benchmarks that have improved:': 'improved',
              'Benchmarks that have stayed the same:': 'unchanged',
              'Benchmarks that have got worse:': 'worse',
              'Benchmarks that have gotten worse:': 'worse',
              'Benchmarks that are not comparable:': 'other',
            };
            const sections = [];
            let current = { kind: 'other', lines: [] };
            for (const line of compareResults.split(/\r?\n/)) {
              const kind = Object.hasOwn(headings, line.trim())
                ? headings[line.trim()]
                : /^Benchmarks .*:$/.test(line.trim()) ? 'other' : undefined;
              if (kind) {
                sections.push(current);
                current = { kind, lines: [] };
              }
              current.lines.push(line);
            }
            sections.push(current);
            const visible = kind => sections
              .filter(section => section.kind === kind)
              .map(section => section.lines.join('\n').trim())
              .filter(Boolean);
            const unchanged = visible('unchanged');
            const parts = [
              '## ASV Benchmarking',
              ...visible('worse'),
              ...visible('improved'),
              ...visible('other'),
            ];
            if (unchanged.length) {
              parts.push([
                '<details>',
                '<summary>Benchmarks that have stayed the same</summary>',
                '',
                ...unchanged,
                '',
                '</details>',
              ].join('\n'));
            }
            const newComment = parts.join('\n\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const botComment = comments.find(
              c => c.user.login === 'github-actions[bot]'
                && c.body.includes('## ASV Benchmarking'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: newComment,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: newComment,
              });
            }
